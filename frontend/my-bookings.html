<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Bookings | Go Trip</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="my-bookings-body">


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="profile-navbar">

        <a href="index.html" class="brand">
            Go Trip
        </a>

        <a href="profile.html" class="back-home">
            ← My Profile
        </a>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="my-bookings-page">

        <section class="my-bookings-section">


            <!-- PAGE HEADING -->

            <div class="my-bookings-heading">

                <span class="eyebrow">
                    YOUR TRIPS
                </span>

                <h1>
                    My Bookings
                </h1>

                <p>
                    View and manage your Go Trip bookings.
                </p>

            </div>



            <!-- BOOKINGS -->

            <div id="bookingsContainer">

                <div class="booking-loading">

                    <div class="loading-spinner"></div>

                    <p>
                        Loading your bookings...
                    </p>

                </div>

            </div>


        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
